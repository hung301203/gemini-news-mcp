[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "gemini-news-mcp"
version = "0.1.0"
description = "Stateless Streamable HTTP MCP server on Render for Gemini Web: Automation science, Finance & volatility drivers, and evidence-based Wellness with transparent credibility scoring."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.0.0,<3",
  "httpx>=0.27.0",
  "feedparser>=6.0.11",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.2.0",
  "starlette>=0.40.0",
  "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[project.scripts]
gemini-news-mcp = "gemini_news_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_news_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-q", "--tb=short"]
